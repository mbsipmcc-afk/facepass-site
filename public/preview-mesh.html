<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0;background:#111} #info{color:#fff;font:12px monospace;position:fixed;top:8px;left:8px}</style>
</head>
<body>
<div id="info">LeePerrySmith raw mesh — normal shading — drag to rotate (not wired: auto orbit)</div>
<script type="importmap">
{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const draco = new DRACOLoader();
draco.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/libs/draco/");
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);
loader.load("/models/lee-perry-smith.glb", (gltf) => {
  const mesh = gltf.scene;
  mesh.traverse((o) => {
    if (o.isMesh) {
      o.material = new THREE.MeshStandardMaterial({ color: 0x9db8ff, roughness: 0.55, metalness: 0.05, side: THREE.DoubleSide });
    }
  });
  scene.add(mesh);
  window.__cam = camera;
  const key = new THREE.DirectionalLight(0xffffff, 2.2);
  key.position.set(2, 3, -4);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x88aaff, 0.8);
  fill.position.set(-3, 1, 3);
  scene.add(fill);
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const bb = new THREE.Box3().setFromObject(mesh);
  const c = bb.getCenter(new THREE.Vector3());
  const size = bb.getSize(new THREE.Vector3());
  mesh.position.sub(c);
  // zoom on the nose/mouth: face is on +Z
  camera.position.set(size.x * 0.25, -size.y * 0.02, size.z * 1.15);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.update();
  const loop = () => {
    requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
  };
  loop();
});
</script>
</body>
</html>
